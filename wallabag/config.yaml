---
name: Wallabag
version: 1.0.1
slug: wallabag
description: "Self-hosted web application allowing you to save web pages for later reading (like Instapaper or ReadLater)"
url: "https://github.com/banditto9/addon-wallabag/"
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
services:
  - mysql:want
arch:
  - aarch64
  - amd64
hassio_api: true
map:
  - ssl
ports:
  80/tcp: 8000
ports_description:
  80/tcp: Web interface
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  twofactor_auth: true
  anyone_can_register: false
schema:
  remote_mysql_host: str?
  remote_mysql_database: str?
  remote_mysql_username: str?
  remote_mysql_password: password?
  remote_mysql_port: int?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  certfile: str
  keyfile: str
  ssl: bool
  token_secret: str?
  app_url: str?
  app_name: str?
  locale: list(en|pt-PT)?
  twofactor_auth: bool
  twofactor_sender: str?
  anyone_can_register: bool
  fosuser_confirmation: bool
init: false
